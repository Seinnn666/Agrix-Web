<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs><style>
text{font-family:Arial,Helvetica,sans-serif;fill:#17232b}.title{font-size:27px;font-weight:700}.section{font-size:21px;font-weight:700}.user{font-size:19px;font-weight:700}.module{font-size:16px;font-weight:600}.sub{font-size:13px}.small{font-size:14px;fill:#53636d}.panel{fill:#fffdf7;stroke:#27343a;stroke-width:2.5}.box{fill:#fff;stroke:#27343a;stroke-width:1.8}.subbox{fill:#fff9df;stroke:#d59a00;stroke-width:1.7}.arrow{stroke:#64747b;stroke-width:2;fill:none;marker-end:url(#arrow)}
</style><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64747b"/></marker></defs>
<rect width="1600" height="1040" fill="#f5f8f7"/>
<text x="52" y="44" class="title">AgriX User Modules</text><text x="52" y="72" class="small">Web and mobile application structure</text>
<!-- Web boundary -->
<rect x="35" y="105" width="1025" height="940" rx="18" fill="none" stroke="#28373d" stroke-width="2.5" stroke-dasharray="14 10"/>
<rect x="58" y="91" width="204" height="31" fill="#f5f8f7"/><text x="66" y="114" class="section">WEB APPLICATION</text>
